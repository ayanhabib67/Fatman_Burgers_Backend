name: Wipe FatMan orders (VPS)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/TRIGGER_VPS_WIPE'

concurrency:
  group: wipe-fatman-orders
  cancel-in-progress: false

jobs:
  wipe:
    runs-on: ubuntu-latest
    steps:
      - name: Clear FatMan till records on VPS Mongo
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd /var/www/fatman/backend
            git fetch origin main
            git reset --hard origin/main
            node src/scripts/clear-fatman-orders.js
